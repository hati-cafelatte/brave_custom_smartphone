<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Start</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,#2b3a67,#0b0e1a)}
  #stage>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity var(--fade,1s) ease}
  body.contain #stage img,body.contain #stage video{object-fit:contain}
  #ui{position:fixed;inset:0}
  .abs{position:absolute;transform:translate(-50%,-50%)}
  #clock{text-align:center;white-space:nowrap;line-height:1.05;letter-spacing:.02em;pointer-events:none}
  #clock small{display:block;font-size:.22em;font-weight:300;letter-spacing:.12em;margin-top:.5em;opacity:.9}
  #sf input{width:100%;border:0;outline:0;padding:13px 18px;font-size:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #sf input::placeholder{color:inherit;opacity:.6}
  #sc{display:grid;gap:16px 6px;justify-items:center}
  #sc a{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-decoration:none;width:100%;min-width:0}
  #sc i{display:grid;place-items:center;font-style:normal;font-weight:600;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  #sc span{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.8)}
  #gear{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));
    width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.3);color:#fff;font-size:20px;
    display:grid;place-items:center;text-decoration:none;opacity:.3}
  body.pv #gear{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"></div>
<a id="gear" href="settings.html" aria-label="設定">⚙</a>
<script src="common.js"></script>
<script>
(() => {
  const { ENG, FONTS, getAll, load, fixUrl } = SP;
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), ui = $('#ui');
  const pv = /[?&]preview/.test(location.search);   // 設定画面のプレビュー用
  let cfg = load(), bgURL = null, timer = 0;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
  const hue = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };

  // ---------- 背景(スライドショー対応) ----------
  let media = [], cur = 0, slideTimer = 0;
  const slide = () => cfg.show.on && !pv && media.length > 1;
  const pick = () => {
    const n = media.length;
    if (cfg.show.random) { let j; do j = Math.floor(Math.random() * n); while (j === cur); return j; }
    return (cur + 1) % n;
  };
  // 次の1枚だけを読み込む(全部をメモリに展開しない)
  function layer(a) {
    return new Promise(res => {
      const u = URL.createObjectURL(a.blob);
      let el;
      if (a.type.startsWith('video/')) {
        el = document.createElement('video');
        el.muted = true; el.loop = true; el.playsInline = true; el.setAttribute('playsinline', '');
        el.preload = 'auto'; el.src = pv ? u + '#t=0.1' : u;
        el.addEventListener('loadeddata', () => res(el), { once: true });
        setTimeout(() => res(el), 4000);
      } else {
        el = new Image(); el.src = u;
        (el.decode ? el.decode() : Promise.resolve()).catch(() => {}).then(() => res(el));
      }
      el._u = u;
    });
  }
  async function show(i, fade) {
    cur = i;
    const el = await layer(media[i]);
    const old = [...stage.children];
    el.style.opacity = fade ? 0 : 1;
    stage.append(el);
    if (el.tagName === 'VIDEO' && !pv) el.play().catch(() => {});
    if (fade) { void el.offsetWidth; el.style.opacity = 1; }
    const drop = () => old.forEach(o => { if (o.pause) o.pause(); o.remove(); URL.revokeObjectURL(o._u); });
    fade ? setTimeout(drop, cfg.show.fade * 1000 + 100) : drop();
  }
  function schedule() {
    clearTimeout(slideTimer);
    if (!slide() || cfg.show.mode !== 'timer' || document.hidden) return;
    slideTimer = setTimeout(async () => { await show(pick(), true); schedule(); }, cfg.show.sec * 1000);
  }
  async function applyBg(advance) {
    clearTimeout(slideTimer);
    media = (await getAll()).sort((a, b) => (a.t || 0) - (b.t || 0));
    stage.style.setProperty('--fade', cfg.show.fade + 's');
    if (!media.length) { stage.innerHTML = ''; return; }
    let i = media.findIndex(x => x.id === localStorage.active);
    if (i < 0) i = 0;
    cur = i;
    if (advance && slide() && cfg.show.mode === 'open') { i = pick(); localStorage.active = media[i].id; }
    await show(i, false);
    schedule();
  }

  // ---------- 時計 ----------
  function tick() {
    const c = cfg.clock, n = new Date();
    const t = $('#time'); if (!t) return;
    t.textContent = n.toLocaleTimeString('ja-JP', {
      hour: '2-digit', minute: '2-digit', second: c.sec ? '2-digit' : undefined, hour12: !c.h24 });
    const d = $('#date');
    if (d) d.textContent = n.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
    // 秒なしなら次の分の頭まで眠る(1分に1回だけ起きる)
    const wait = c.sec ? 1000 - n.getMilliseconds() : 60000 - (n.getSeconds() * 1000 + n.getMilliseconds()) + 30;
    timer = setTimeout(tick, wait);
  }

  // ---------- UI(設定を元に1回だけ組み立てる) ----------
  function renderUI() {
    clearTimeout(timer);
    document.body.classList.toggle('contain', cfg.fit === 'contain');
    document.body.classList.toggle('pv', pv);
    let h = '';
    const c = cfg.clock, s = cfg.search, k = cfg.sc;

    if (c.on) {
      const col = c.grad
        ? `background:linear-gradient(180deg,${c.c1},${c.c2});-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;`
        : `color:${c.c1};`;
      const glow = c.glow ? `filter:drop-shadow(0 0 .12em ${c.c1}99);` : 'text-shadow:0 2px 14px rgba(0,0,0,.45);';
      h += `<div id="clock" class="abs" style="left:${c.x}%;top:${c.y}%;font-family:${FONTS[c.font]};font-weight:${c.weight};font-size:${c.size}vmin;${glow}">
        <div style="${col}"><span id="time"></span>${c.date ? '<small id="date"></small>' : ''}</div></div>`;
    }
    if (s.on) {
      h += `<form id="sf" class="abs" style="left:${s.x}%;top:${s.y}%;width:${s.w}%">
        <input type="search" name="q" autocomplete="off" enterkeyhint="search" placeholder="${esc(ENG[s.engine][0])}で検索"
          style="background:${rgba(s.bg, s.op / 100)};color:${s.color};border-radius:${s.radius}px"></form>`;
    }
    if (k.on && k.items.length) {
      h += `<div id="sc" class="abs" style="left:${k.x}%;top:${k.y}%;width:92%;grid-template-columns:repeat(${k.cols},1fr)">`;
      for (const it of k.items) {
        const bg = k.mode === 'auto' ? `hsl(${hue(it.name || it.url)},58%,46%)` : k.color;
        const r = k.shape === 'round' ? '50%' : '24%';
        h += `<a href="${esc(fixUrl(it.url))}"><i style="width:${k.size}px;height:${k.size}px;border-radius:${r};background:${bg};font-size:${k.size * .42}px">${esc([...(it.name || '?')][0].toUpperCase())}</i>${k.label ? `<span>${esc(it.name)}</span>` : ''}</a>`;
      }
      h += '</div>';
    }
    ui.innerHTML = h;
    if (c.on) tick();
  }

  ui.addEventListener('submit', e => {
    e.preventDefault();
    if (pv) return;
    const q = e.target.q.value.trim();
    if (!q) return;
    location.href = /^https?:\/\//i.test(q) ? q : ENG[cfg.search.engine][1] + encodeURIComponent(q);
  });
  ui.addEventListener('click', e => { if (pv && e.target.closest('a')) e.preventDefault(); });

  // 画面が隠れている間は時計・動画・スライドのタイマーを止める
  document.addEventListener('visibilitychange', () => {
    const v = stage.lastElementChild;
    if (document.hidden) { clearTimeout(timer); clearTimeout(slideTimer); if (v && v.pause && !pv) v.pause(); }
    else {
      if (cfg.clock.on) { clearTimeout(timer); tick(); }
      schedule();
      if (v && v.play && !pv) v.play().catch(() => {});
    }
  });

  // 設定ページから「戻る」で復帰したとき、1回だけ読み直す
  addEventListener('pageshow', e => { if (e.persisted) { cfg = load(); renderUI(); applyBg(true); } });

  // プレビュー時のみ: 設定ページからのメッセージで更新(常時監視ではなくイベント駆動)
  if (pv) addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'cfg') { cfg = e.data.cfg; renderUI(); }
    if (e.data.type === 'bg') applyBg();
  });

  renderUI();
  applyBg(true);
  if ('serviceWorker' in navigator && !pv) navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>
</body>
</html>

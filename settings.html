<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>設定 - Start</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0d0f14;color:#e8e8ee;font-family:system-ui,sans-serif;font-size:15px}
  a{color:#7da2ff}
  #top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
  #wrap{display:grid;gap:0 16px;padding:0 12px 60px;max-width:960px;margin:auto}
  #pvbox{position:sticky;top:0;z-index:5;background:#0d0f14;padding:6px 0 10px}
  #pv{display:block;margin:auto;height:34vh;aspect-ratio:9/19;border:1px solid #2c3140;border-radius:16px;background:#000}
  .card{background:#171a22;border-radius:14px;padding:12px 14px;margin:0 0 12px}
  .card h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
  .card.off .fields{opacity:.35}
  .f{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #222735}
  .f span{flex:0 0 7.5em;font-size:13px;opacity:.85}
  .f input[type=range]{flex:1;min-width:0}
  .f output{flex:0 0 2.6em;text-align:right;font-size:12px;opacity:.7}
  .f select,.f input[type=color]{margin-left:auto}
  select,input[type=text],textarea{background:#232838;color:#fff;border:1px solid #2f3547;border-radius:8px;padding:8px;font-size:14px}
  input[type=color]{width:46px;height:30px;padding:0;border:0;background:none}
  .sc{display:grid;grid-template-columns:1fr 2fr auto;gap:6px;margin:6px 0}
  .sc input{min-width:0}
  button,label.btn{background:#2a2f3f;color:#fff;border:0;border-radius:10px;padding:9px 13px;font-size:14px;cursor:pointer;display:inline-block}
  button.p,label.btn{background:#3b6cff}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  #list{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  .item{position:relative;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:#000;outline:2px solid transparent}
  .item.active{outline-color:#3b6cff}
  .item img,.item video{width:100%;height:100%;object-fit:cover;pointer-events:none}
  .item .x{position:absolute;top:3px;right:3px;padding:1px 7px;border-radius:7px;background:rgba(0,0,0,.7);font-size:12px}
  .item .tag{position:absolute;left:3px;bottom:3px;font-size:10px;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:5px}
  small{opacity:.6;line-height:1.5;display:block;margin-top:6px}
  textarea{width:100%;height:90px;font-family:ui-monospace,monospace;font-size:12px}
  #drop{position:fixed;inset:0;display:none;place-items:center;background:rgba(59,108,255,.4);font-size:22px;z-index:9}
  @media(min-width:820px){
    #wrap{grid-template-columns:1fr 300px}
    #pvbox{order:2;top:10px;height:calc(100vh - 20px);padding-top:0}
    #pv{height:min(82vh,640px)}
  }
</style>
</head>
<body>
<div id="top"><a href="index.html">← 戻る</a><button id="reset">初期化</button></div>
<div id="wrap">
  <div id="pvbox"><iframe id="pv" src="index.html?preview=1" title="プレビュー"></iframe></div>
  <main id="ctl"></main>
</div>
<div id="drop">ここにドロップして追加</div>

<script src="common.js"></script>
<script>
(() => {
  const { DEF, ENG, load, save, getAll, put, del, profs, saveProfs } = SP;
  const $ = s => document.querySelector(s);
  const ctl = $('#ctl'), pv = $('#pv');
  let cfg = load();

  const engOpts = Object.fromEntries(Object.entries(ENG).map(([k, v]) => [k, v[0]]));
  // [パス, 種類, ラベル, 追加情報]
  const SCHEMA = [
    { t: '背景', f: [
      ['fit', 'sel', '表示方法', { cover: '画面を埋める', contain: '全体を表示' }],
      ['show.on', 'chk', 'スライドショー'],
      ['show.mode', 'sel', '切り替え', { timer: '一定時間ごと', open: '開くたびに1枚進む' }],
      ['show.sec', 'rng', '間隔(秒)', [5, 300, 5]],
      ['show.random', 'chk', 'ランダム順'],
      ['show.fade', 'rng', 'フェード(秒)', [0, 3, 0.2]] ] },
    { t: '時計', on: 'clock.on', f: [
      ['clock.h24', 'chk', '24時間表示'], ['clock.sec', 'chk', '秒を表示'], ['clock.date', 'chk', '日付を表示'],
      ['clock.font', 'sel', 'フォント', { sans: 'ゴシック', round: '丸ゴシック', serif: '明朝', mono: '等幅' }],
      ['clock.weight', 'rng', '太さ', [100, 800, 100]], ['clock.size', 'rng', '大きさ', [8, 40, 1]],
      ['clock.c1', 'col', '文字色'], ['clock.grad', 'chk', 'グラデーション'], ['clock.c2', 'col', 'グラデ下側の色'],
      ['clock.glow', 'chk', '光彩'],
      ['clock.x', 'rng', '横位置 %', [0, 100, 1]], ['clock.y', 'rng', '縦位置 %', [0, 100, 1]] ] },
    { t: '検索バー', on: 'search.on', f: [
      ['search.engine', 'sel', '検索エンジン', engOpts],
      ['search.w', 'rng', '幅 %', [40, 100, 1]], ['search.radius', 'rng', '角丸', [0, 30, 1]],
      ['search.bg', 'col', '背景色'], ['search.op', 'rng', '背景の濃さ', [0, 100, 1]], ['search.color', 'col', '文字色'],
      ['search.x', 'rng', '横位置 %', [0, 100, 1]], ['search.y', 'rng', '縦位置 %', [0, 100, 1]] ] },
    { t: 'ショートカット', on: 'sc.on', items: true, f: [
      ['sc.cols', 'rng', '列数', [3, 6, 1]], ['sc.size', 'rng', 'アイコンの大きさ', [36, 80, 1]],
      ['sc.shape', 'sel', '形', { round: '丸', square: '角丸' }],
      ['sc.mode', 'sel', '色', { auto: '自動(名前で色分け)', fixed: '単色' }], ['sc.color', 'col', '単色の色'],
      ['sc.label', 'chk', '名前を表示'],
      ['sc.x', 'rng', '横位置 %', [0, 100, 1]], ['sc.y', 'rng', '縦位置 %', [0, 100, 1]] ] }
  ];

  // 編集対象: 'global'=共通設定 / 'item'=選択中の背景専用(prof)
  let mode = 'global', tid = null, prof = null;
  const PROFKEYS = ['fit', 'clock', 'search', 'sc'];
  const isGlob = p => p.startsWith('show.');           // スライドショー設定は常に共通
  const root = p => (mode === 'item' && !isGlob(p)) ? prof : cfg;
  const get = p => p.split('.').reduce((o, k) => o[k], root(p));
  const set = (p, v) => { const a = p.split('.'), l = a.pop(); a.reduce((o, k) => o[k], root(p))[l] = v; };
  const snapshot = c => { const o = {}; PROFKEYS.forEach(k => o[k] = structuredClone(c[k])); delete o.sc.items; return o; };  // ショートカット内容は共通
  const effCfg = () => mode === 'item' ? SP.merge(structuredClone(cfg), structuredClone(prof)) : cfg;
  const sortMedia = a => a.sort((x, y) => (x.t || 0) - (y.t || 0));
  const activeId = async () => { const all = sortMedia(await getAll()); return (all.find(x => x.id === localStorage.active) || all[0] || {}).id; };
  async function setItemMode() {
    const id = await activeId();
    if (!id) { alert('先に背景の画像・動画を追加してください'); return; }
    mode = 'item'; tid = id; prof = profs()[id] || snapshot(cfg);
    build(); post();
  }
  const targetCard = () => `<section class="card"><h3>編集対象</h3>
    <div class="row"><button id="mG" class="${mode === 'global' ? 'p' : ''}">共通設定</button><button id="mI" class="${mode === 'item' ? 'p' : ''}">選択中の背景専用</button></div>
    <small>${mode === 'global' ? '全ての背景で使う設定です。専用設定がある背景では、そちらが優先されます。' : 'この背景を表示するときだけ使う設定です。ショートカットの内容とスライドショーは共通です。'}</small>
    ${mode === 'item' && profs()[tid] ? '<div class="row"><button id="mDel">専用設定を削除(共通に戻す)</button></div>' : ''}</section>`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function field([p, t, l, x]) {
    const a = `data-p="${p}"`;
    let i;
    if (t === 'chk') i = `<input type="checkbox" ${a}>`;
    else if (t === 'col') i = `<input type="color" ${a}>`;
    else if (t === 'rng') i = `<input type="range" ${a} min="${x[0]}" max="${x[1]}" step="${x[2]}"><output></output>`;
    else i = `<select ${a}>${Object.entries(x).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>`;
    return `<label class="f"><span>${l}</span>${i}</label>`;
  }

  function build() {
    ctl.innerHTML = targetCard() + SCHEMA.map(s => `<section class="card">
      <h3>${s.on ? `<input type="checkbox" data-p="${s.on}">` : ''}${s.t}</h3>
      <div class="fields">${s.f.map(field).join('')}${s.items ? '<div id="items"></div><button id="addsc">＋ 追加</button>' : ''}</div></section>`).join('')
    + `<section class="card"><h3>背景の画像・動画</h3>
        <div class="row"><label class="btn">追加<input id="file" type="file" accept="image/*,video/*" multiple hidden></label></div>
        <div id="list"></div>
        <small>この端末のブラウザ内にだけ保存されます(通信なし)。タップで切り替え、✕で削除。PCではドラッグ&ドロップも可。</small></section>
      <section class="card"><h3>設定のバックアップ</h3>
        <div class="row"><button id="exp">書き出し</button><button id="imp">読み込み</button></div>
        <textarea id="json" spellcheck="false" placeholder="ここにJSONが出ます。他の端末の設定を貼って「読み込み」"></textarea>
        <small>画像・動画は含まれません。</small></section>`;
    ctl.querySelectorAll('[data-p]').forEach(el => {
      const v = get(el.dataset.p);
      if (el.type === 'checkbox') el.checked = v; else el.value = v;
      if (el.nextElementSibling && el.nextElementSibling.tagName === 'OUTPUT') el.nextElementSibling.value = v;
    });
    SCHEMA.forEach((s, n) => { if (s.on) ctl.querySelectorAll('.card')[n].classList.toggle('off', !get(s.on)); });
    renderItems(); renderList();
  }

  let t = 0;
  function post() {
    clearTimeout(t);
    t = setTimeout(() => pv.contentWindow && pv.contentWindow.postMessage({ type: 'cfg', cfg: effCfg() }, location.origin), 40);
  }
  function push() {
    save(cfg);
    if (mode === 'item') {
      const m = profs(), first = !m[tid];
      m[tid] = prof; saveProfs(m);
      if (first) {   // 初回の変更時だけ「専用」バッジと削除ボタンを出す
        renderList();
        ctl.querySelector('.card').insertAdjacentHTML('beforeend', '<div class="row"><button id="mDel">専用設定を削除(共通に戻す)</button></div>');
      }
    }
    post();
  }
  pv.addEventListener('load', post);

  // 入力はイベント委譲で1か所だけ
  ctl.addEventListener('input', e => {
    const el = e.target, p = el.dataset.p;
    if (p) {
      const v = el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : el.value;
      set(p, v);
      if (el.nextElementSibling && el.nextElementSibling.tagName === 'OUTPUT') el.nextElementSibling.value = v;
      if (el.closest('h3')) el.closest('.card').classList.toggle('off', !v);
      push();
    } else if (el.dataset.i !== undefined) {
      cfg.sc.items[+el.dataset.i][el.dataset.k] = el.value; push();
    }
  });
  ctl.addEventListener('click', e => {
    const b = e.target;
    if (b.id === 'mG') { mode = 'global'; build(); post(); }
    else if (b.id === 'mI') setItemMode();
    else if (b.id === 'mDel') { const pm = profs(); delete pm[tid]; saveProfs(pm); mode = 'global'; build(); post(); }
    else if (b.id === 'addsc') { cfg.sc.items.push({ name: '', url: '' }); renderItems(); push(); }
    else if (b.dataset.del !== undefined) { cfg.sc.items.splice(+b.dataset.del, 1); renderItems(); push(); }
    else if (b.id === 'exp') { const j = $('#json'); j.value = JSON.stringify(cfg); j.select(); navigator.clipboard && navigator.clipboard.writeText(j.value).catch(() => {}); }
    else if (b.id === 'imp') {
      try { cfg = SP.merge(structuredClone(DEF), JSON.parse($('#json').value)); push(); build(); }
      catch (err) { alert('JSONを読み込めませんでした'); }
    }
  });
  ctl.addEventListener('change', e => { if (e.target.id === 'file') { addFiles([...e.target.files]); e.target.value = ''; } });

  function renderItems() {
    const box = $('#items'); if (!box) return;
    box.innerHTML = cfg.sc.items.map((it, i) => `<div class="sc">
      <input type="text" data-i="${i}" data-k="name" placeholder="名前" value="${esc(it.name)}">
      <input type="text" data-i="${i}" data-k="url" placeholder="https://..." value="${esc(it.url)}" inputmode="url" autocapitalize="off">
      <button data-del="${i}">✕</button></div>`).join('');
  }

  // ---------- 背景メディア ----------
  let urls = [];
  async function renderList() {
    const list = $('#list'); if (!list) return;
    urls.forEach(URL.revokeObjectURL); urls = [];
    const all = (await getAll()).sort((a, b) => (a.t || 0) - (b.t || 0));
    const act = (all.find(x => x.id === localStorage.active) || all[0] || {}).id;
    list.innerHTML = '';
    all.forEach(m => {
      const u = URL.createObjectURL(m.blob); urls.push(u);
      const v = m.type.startsWith('video/'), hasP = !!profs()[m.id];
      const d = document.createElement('div');
      d.className = 'item' + (m.id === act ? ' active' : '');
      d.innerHTML = (v ? `<video src="${u}#t=0.1" muted playsinline preload="metadata"></video><span class="tag">動画</span>` : `<img src="${u}">`) + (hasP ? '<span class="tag" style="left:auto;right:3px;bottom:3px;background:#3b6cff">専用</span>' : '') + '<span class="x">✕</span>';
      d.onclick = async e => {
        if (e.target.classList.contains('x')) {
          if (!confirm('削除しますか?')) return;
          await del(m.id);
          const pm = profs(); delete pm[m.id]; saveProfs(pm);
          if (mode === 'item') { mode = 'global'; build(); post(); }
        } else {
          localStorage.active = m.id;
          if (mode === 'item') { tid = m.id; prof = profs()[tid] || snapshot(cfg); build(); post(); }
        }
        renderList(); bgChanged();
      };
      list.append(d);
    });
  }
  const bgChanged = () => pv.contentWindow && pv.contentWindow.postMessage({ type: 'bg' }, location.origin);

  async function addFiles(files) {
    let last, n = 0;
    for (const f of files) {
      if (!/^(image|video)\//.test(f.type)) continue;
      last = crypto.randomUUID();
      await put({ id: last, name: f.name, type: f.type, blob: f, t: Date.now() + n++ });
    }
    if (!last) return;
    localStorage.active = last;
    renderList(); bgChanged();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  }

  const drop = $('#drop');
  addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'grid'; });
  addEventListener('dragleave', e => { if (!e.relatedTarget) drop.style.display = 'none'; });
  addEventListener('drop', e => { e.preventDefault(); drop.style.display = 'none'; addFiles([...e.dataTransfer.files]); });

  $('#reset').onclick = () => { if (confirm('設定を初期化しますか?(背景は残ります)')) { cfg = structuredClone(DEF); push(); build(); } };

  build();
})();
</script>
</body>
</html>
